# nginx site for a domain proxied by Cloudflare (orange-cloud DNS records, SSL/TLS mode "Full (strict)").
# Hiding the server's IP behind Cloudflare also hides which other sites share that server.
#
#   1. Replace YOUR_DOMAIN below.
#   2. Cloudflare → SSL/TLS → Origin Server → Create certificate, using a CSR made on the server:
#        sudo install -d -m 700 /etc/ssl/nitsdate
#        sudo openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
#             -keyout /etc/ssl/nitsdate/origin.key -out /etc/ssl/nitsdate/origin.csr -subj /CN=YOUR_DOMAIN
#      and save the certificate Cloudflare returns as /etc/ssl/nitsdate/origin.pem (valid 15 years, no renewals).
#   3. sudo deploy/cloudflare-ips.sh    (writes the Cloudflare IP snippets used below)
#   4. sudo cp deploy/nginx-nitsdate-cloudflare.conf /etc/nginx/sites-available/nitsdate-cloudflare
#      sudo ln -s /etc/nginx/sites-available/nitsdate-cloudflare /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo nginx -s reload

# 1 when the TCP connection itself came from Cloudflare (checked before the real-IP rewrite)
geo $realip_remote_addr $nitsdate_via_cloudflare {
    include snippets/cloudflare-geo.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/ssl/nitsdate/origin.pem;   # Cloudflare Origin CA certificate
    ssl_certificate_key /etc/ssl/nitsdate/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/cloudflare-realip.conf;            # logs and the app see the visitor's IP
    if ($nitsdate_via_cloudflare = 0) { return 444; }   # refuse anyone bypassing Cloudflare
    if ($host = www.YOUR_DOMAIN) { return 301 https://YOUR_DOMAIN$request_uri; }

    client_max_body_size 12m;               # photos are re-encoded server-side; 8 MB app limit
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /home/ubuntu/nitsdate/staticfiles/;
        expires 30d;                        # file names are hashed, so this is safe
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
