# nginx site. Replace YOUR_DOMAIN, then:
#   sudo cp deploy/nginx-nitsdate.conf /etc/nginx/sites-available/nitsdate
#   sudo ln -s /etc/nginx/sites-available/nitsdate /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d YOUR_DOMAIN       (adds the HTTPS server block)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 12m;               # photos are re-encoded server-side; 8 MB app limit
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /home/ubuntu/nitsdate/staticfiles/;
        expires 30d;                        # file names are hashed, so this is safe
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
